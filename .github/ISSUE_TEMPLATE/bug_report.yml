name: Bug report
description: Report a problem with the viewer, tooling, or documentation.
title: "[Bug] "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command or interaction, repository revision, and relevant input.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Screenshots or concise error output help.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, or Python/Node version, as relevant.
